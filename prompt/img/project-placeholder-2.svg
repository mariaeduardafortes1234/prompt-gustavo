<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC"/>
      <stop offset="50%" stop-color="#FFF0F3"/>
      <stop offset="100%" stop-color="#FFC2D1"/>
    </linearGradient>
    <linearGradient id="roseAccent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#FB6F92"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FB6F92" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="24" fill="url(#bgGrad3)"/>

  <!-- Sleek Modern UI Mockup -->
  <g transform="translate(50, 45)" filter="url(#shadow3)">
    <rect width="500" height="290" rx="18" fill="#FFFFFF" stroke="#FFB3C6" stroke-width="1.5"/>

    <!-- App Header -->
    <path d="M 0 18 C 0 8 8 0 18 0 L 482 0 C 492 0 500 8 500 18 L 500 48 L 0 48 Z" fill="#FFE5EC"/>
    <circle cx="25" cy="24" r="5" fill="#FB6F92"/>
    <circle cx="42" cy="24" r="5" fill="#FF8FAB"/>
    <circle cx="59" cy="24" r="5" fill="#FFC2D1"/>
    <text x="250" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#2E1C24" text-anchor="middle">Aplicação Web Interativa ✦ Em Criação</text>

    <!-- Grid Layout inside App -->
    <g transform="translate(25, 68)">
      <!-- Left Card -->
      <rect x="0" y="0" width="210" height="190" rx="14" fill="#FFF9FA" stroke="#FFE5EC" stroke-width="1"/>
      <circle cx="35" cy="35" r="18" fill="#FFE5EC"/>
      <text x="35" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">✨</text>
      <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#2E1C24">Interface Criativa</text>
      <rect x="20" y="70" width="170" height="8" rx="4" fill="#FFC2D1"/>
      <rect x="20" y="88" width="140" height="8" rx="4" fill="#FFE5EC"/>
      <rect x="20" y="106" width="160" height="8" rx="4" fill="#FFE5EC"/>
      <rect x="20" y="140" width="100" height="28" rx="14" fill="url(#roseAccent3)"/>
      <text x="70" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Explorar 🌸</text>

      <!-- Right Card -->
      <rect x="235" y="0" width="215" height="190" rx="14" fill="#FFFFFF" stroke="#FFE5EC" stroke-width="1"/>
      
      <!-- Mini Chart / Metrics UI -->
      <rect x="250" y="20" width="80" height="12" rx="6" fill="#FFE5EC"/>
      <line x1="250" y1="120" x2="430" y2="120" stroke="#FFE5EC" stroke-width="1.5"/>
      <path d="M 260 100 Q 295 50 330 85 T 400 40 L 420 60" fill="none" stroke="#FB6F92" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="400" cy="40" r="4" fill="#FB6F92"/>
      <circle cx="330" cy="85" r="3.5" fill="#FF8FAB"/>

      <rect x="250" y="145" width="180" height="22" rx="11" fill="#FFE5EC"/>
      <text x="340" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FB6F92" text-anchor="middle">Frontend • UI/UX • Responsivo</text>
    </g>
  </g>
</svg>

