<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB3C6" />
      <stop offset="100%" stop-color="#FF8FAB" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="50%" stop-color="#FF8FAB" />
      <stop offset="100%" stop-color="#FB6F92" />
    </linearGradient>
  </defs>

  <!-- Stem & Vine -->
  <path d="M 10 190 Q 60 140 100 120 T 170 30" fill="none" stroke="#FFB3C6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Side Leaves -->
  <path d="M 60 150 Q 40 120 70 125 C 80 135 70 150 60 150 Z" fill="url(#leafGrad)" opacity="0.8"/>
  <path d="M 100 120 Q 130 95 125 125 C 115 135 100 125 100 120 Z" fill="url(#leafGrad)" opacity="0.8"/>
  <path d="M 135 85 Q 115 60 145 65 C 150 75 145 85 135 85 Z" fill="url(#leafGrad)" opacity="0.8"/>

  <!-- Blossoms -->
  <g transform="translate(170, 30)">
    <circle cx="0" cy="0" r="16" fill="#FFF0F3" stroke="#FF8FAB" stroke-width="1"/>
    <!-- 5 Petals -->
    <path d="M 0 -7 C -7 -18, 7 -18, 0 -7" fill="url(#petalGrad)" transform="rotate(0)"/>
    <path d="M 0 -7 C -7 -18, 7 -18, 0 -7" fill="url(#petalGrad)" transform="rotate(72)"/>
    <path d="M 0 -7 C -7 -18, 7 -18, 0 -7" fill="url(#petalGrad)" transform="rotate(144)"/>
    <path d="M 0 -7 C -7 -18, 7 -18, 0 -7" fill="url(#petalGrad)" transform="rotate(216)"/>
    <path d="M 0 -7 C -7 -18, 7 -18, 0 -7" fill="url(#petalGrad)" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFF0F3" stroke="#FB6F92" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FB6F92"/>
  </g>

  <g transform="translate(45, 175) scale(0.65)">
    <circle cx="0" cy="0" r="14" fill="#FFF0F3"/>
    <path d="M 0 -6 C -6 -15, 6 -15, 0 -6" fill="url(#petalGrad)" transform="rotate(0)"/>
    <path d="M 0 -6 C -6 -15, 6 -15, 0 -6" fill="url(#petalGrad)" transform="rotate(72)"/>
    <path d="M 0 -6 C -6 -15, 6 -15, 0 -6" fill="url(#petalGrad)" transform="rotate(144)"/>
    <path d="M 0 -6 C -6 -15, 6 -15, 0 -6" fill="url(#petalGrad)" transform="rotate(216)"/>
    <path d="M 0 -6 C -6 -15, 6 -15, 0 -6" fill="url(#petalGrad)" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3" fill="#FB6F92"/>
  </g>
</svg>

