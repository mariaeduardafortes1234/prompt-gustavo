<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC"/>
      <stop offset="100%" stop-color="#FFC2D1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F7"/>
    </linearGradient>
    <linearGradient id="roseBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#FB6F92"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#FB6F92" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="24" fill="url(#pGrad1)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(40, 35)" filter="url(#pShadow)">
    <rect width="520" height="310" rx="16" fill="url(#cardGrad)" stroke="#FFB3C6" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 504 0 C 512.84 0 520 7.16 520 16 L 520 40 L 0 40 Z" fill="#FFE5EC"/>
    <circle cx="24" cy="20" r="5" fill="#FB6F92"/>
    <circle cx="40" cy="20" r="5" fill="#FF8FAB"/>
    <circle cx="56" cy="20" r="5" fill="#FFC2D1"/>

    <!-- Search/URL Bar -->
    <rect x="80" y="10" width="360" height="20" rx="10" fill="#FFFFFF" stroke="#FFB3C6" stroke-width="1"/>
    <text x="260" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FB6F92" text-anchor="middle" font-weight="600">portfolio-maria-eduarda.dev 🌸</text>

    <!-- Browser Content -->
    <!-- Nav Mock -->
    <text x="30" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#2E1C24">Maria Eduarda ✦</text>
    <rect x="420" y="58" width="70" height="18" rx="9" fill="url(#roseBtn)"/>
    <text x="455" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Contato</text>

    <!-- Hero Content Mock -->
    <rect x="30" y="100" width="130" height="18" rx="9" fill="#FFE5EC"/>
    <text x="95" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FB6F92" text-anchor="middle" font-weight="bold">✦ DESENVOLVEDORA WEB</text>

    <text x="30" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#2E1C24">Código, Design &amp;</text>
    <text x="30" y="178" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#FB6F92">Delicadeza.</text>

    <rect x="30" y="200" width="110" height="30" rx="15" fill="url(#roseBtn)"/>
    <text x="85" y="219" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Meus Projetos 🌸</text>

    <!-- Right Side Mock Visual: Code snippet & flower -->
    <g transform="translate(300, 100)">
      <rect width="190" height="150" rx="14" fill="#FFFFFF" stroke="#FFB3C6" stroke-width="1.5"/>
      <rect x="15" y="20" width="80" height="8" rx="4" fill="#FFE5EC"/>
      <rect x="15" y="38" width="140" height="6" rx="3" fill="#FFC2D1"/>
      <rect x="15" y="54" width="110" height="6" rx="3" fill="#FF8FAB"/>
      <rect x="15" y="70" width="150" height="6" rx="3" fill="#FFE5EC"/>
      
      <!-- Mini Blossom -->
      <g transform="translate(145, 110)">
        <circle cx="0" cy="0" r="18" fill="#FFE5EC"/>
        <path d="M 0 -10 C -5 -16, 5 -16, 0 -10" fill="#FB6F92" transform="rotate(0)"/>
        <path d="M 0 -10 C -5 -16, 5 -16, 0 -10" fill="#FB6F92" transform="rotate(72)"/>
        <path d="M 0 -10 C -5 -16, 5 -16, 0 -10" fill="#FB6F92" transform="rotate(144)"/>
        <path d="M 0 -10 C -5 -16, 5 -16, 0 -10" fill="#FB6F92" transform="rotate(216)"/>
        <path d="M 0 -10 C -5 -16, 5 -16, 0 -10" fill="#FB6F92" transform="rotate(288)"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFF0F3"/>
      </g>
      <text x="20" y="115" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FB6F92">&lt;code /&gt;</text>
      <text x="20" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6E5662">HTML • CSS • JS</text>
    </g>
  </g>
</svg>

