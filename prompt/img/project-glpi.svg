        <rect x="0" y="68" width="102" height="24" rx="8" fill="transparent"/>
        <text x="12" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#6E5662">💻 Ativos &amp; TI</text>

