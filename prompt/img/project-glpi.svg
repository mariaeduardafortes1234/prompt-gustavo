<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="glpiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="50%" stop-color="#FFE5EC"/>
      <stop offset="100%" stop-color="#FFC2D1"/>
    </linearGradient>
    <linearGradient id="glpiRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#FB6F92"/>
    </linearGradient>
    <filter id="glpiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#FB6F92" flood-opacity="0.18"/>
